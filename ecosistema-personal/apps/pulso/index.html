function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true}catch(e){storageOK=false;toast('No se pudo guardar: el almacenamiento está lleno. Exporta un respaldo.')}}
function templateTask(title,area,habitId,block,i,date){return {id:aid(),title,area,objective:'',block,order:i,estimate:0,fixedTime:'',required:true,habitId,done:false,createdAt:date}}
function ensureDay(d){if(!db.days[d]){let tasks=MORNING.map((m,i)=>templateTask(m[0],m[1],m[2],'b1',i,d));tasks.push(templateTask('Desconexión digital y preparar el descanso','Salud','h_disconnect','b7',0,d));db.days[d]={tasks};save()}if(!Array.isArray(db.days[d].tasks))db.days[d].tasks=[];return db.days[d]}
const dayTasks=d=>(db.days[d]?.tasks||[]);
function habitActiveAt(h,date){let ds=(h.days||[0,1,2,3,4,5,6]);return h.active!==false&&date>=(h.createdAt||date)&&ds.includes(parseDate(date).getDay())}
function habitCompleted(hid,date){return !!db.manual[date]?.[hid]||dayTasks(date).some(t=>t.done&&t.habitId===hid)}
function habCounts(h,month=ui.month){let days=new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate(), done=0,scheduled=0;let end=nowDate();for(let k=1;k<=days;k++){let date=month+'-'+String(k).padStart(2,'0');if(date>end||!habitActiveAt(h,date))continue;scheduled++;if(habitCompleted(h.id,date))done++}return {done,scheduled,pct:scheduled?Math.round(100*done/scheduled):0}}
function doneHabitsToday(date=ui.date){let hs=db.habits.filter(h=>habitActiveAt(h,date));return {done:hs.filter(h=>habitCompleted(h.id,date)).length,total:hs.length}}
function sumSec(sessions){return sessions.reduce((s,x)=>s+num(x.seconds),0)}
function dur(sec){sec=Math.max(0,num(sec));let mins=Math.round(sec/60),h=Math.floor(mins/60),m=mins%60;return h?h+' h '+String(m).padStart(2,'0')+' min':m+' min'}
function clockFmt(s){s=Math.max(0,Math.floor(num(s)));let h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return [h,m,ss].map((x,i)=>String(x).padStart(i?2:2,'0')).join(':')}
function weekStart(date){let day=parseDate(date),diff=(day.getDay()+6)%7;day.setDate(day.getDate()-diff);return nowISODate(day)}
function nowISODate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function sessionsIn(scope,date=ui.date){let start,end;if(scope==='day'){start=end=date}else if(scope==='week'){start=weekStart(date);end=datePlus(start,6)}else{start=date.slice(0,7)+'-01';end=date.slice(0,7)+'-'+new Date(Number(date.slice(0,4)),Number(date.slice(5,7)),0).getDate()}return db.sessions.filter(s=>s.date>=start&&s.date<=end)}
function xp(){let tasks=Object.values(db.days).reduce((n,v)=>n+(v.tasks||[]).filter(t=>t.done).length,0);let dates=new Set([...Object.keys(db.days),...Object.keys(db.manual)]),hab=0;for(let date of dates){hab+=db.habits.filter(h=>habitActiveAt(h,date)&&habitCompleted(h.id,date)).length}return tasks*10+hab*5+Math.floor(sumSec(db.sessions)/600)*2}
function streak(){let today=nowDate(),offset=0;function any(d){return dayTasks(d).some(t=>t.done)||db.habits.some(h=>habitActiveAt(h,d)&&habitCompleted(h.id,d))}if(!any(today))offset=1;let days=0;while(days<366&&any(datePlus(today,-offset))){days++;offset++}return days}
function lvl(){let score=xp();return {level:Math.floor(score/250)+1,inLevel:score%250,score}}
function nowBlock(){let clock=new Date();let mins=clock.getHours()*60+clock.getMinutes();return BLOCKS.find(b=>{let [a,c]=b.start.split(':').map(Number),[e,f]=b.end.split(':').map(Number);return mins>=a*60+c&&mins<e*60+f})?.id||null}

function areaTotals(sessions){let d={};sessions.forEach(s=>d[s.area]=(d[s.area]||0)+num(s.seconds));return Object.entries(d).sort((a,b)=>b[1]-a[1])}
function barsFromEntries(entries,limit=8){if(!entries.length)return '<div class="empty">Aún no hay tiempo registrado en este período.</div>';let max=Math.max(...entries.map(a=>a[1]),1);return '<div class="bar-chart">'+entries.slice(0,limit).map(([name,seconds])=>'<div class="bar-row"><div class="name" title="'+E(name)+'">'+E(name)+'</div><div class="track"><div class="fill" style="width:'+Math.max(1,seconds/max*100)+'%"></div></div><div class="duration">'+dur(seconds)+'</div></div>').join('')+'</div>'}

function taskHTML(t,block){let logged=sumSec(db.sessions.filter(s=>s.taskId===t.id)),habit=db.habits.find(h=>h.id===t.habitId);return '<article class="task '+(t.done?'done':'')+'" data-task="'+t.id+'" draggable="true"><input type="checkbox" class="check-task" data-action="toggleTask" data-id="'+t.id+'" '+(t.done?'checked':'')+' aria-label="Marcar '+E(t.title)+' como completado"><div class="task-main"><div class="task-title">'+E(t.title)+'</div><div class="task-meta"><span class="pill dark">'+E(t.area)+'</span>'+(t.required?'<span class="pill redpill">Obligatoria</span>':'')+(t.fixedTime?'<span class="pill">'+ic('clock')+' '+E(t.fixedTime)+'</span>':'')+(habit?'<span class="pill greenpill">↗ '+E(habit.name)+'</span>':'')+(t.objective?'<span class="pill">'+E(t.objective)+'</span>':'')+(t.estimate?'<span class="pill dark">≈'+t.estimate+' min</span>':'')+'</div><div class="task-extra"><input aria-label="Minutos reales de '+E(t.title)+'" type="number" data-min="'+t.id+'" min="0.5" max="1440" step="0.5" placeholder="min"><button data-action="logQuick" data-id="'+t.id+'">+ Registrar min</button><button data-action="startTaskTimer" data-id="'+t.id+'">'+ic('play')+' Iniciar</button>'+(logged?'<span class="tracked">'+dur(logged)+' reales</span>':'')+'</div></div><div class="task-tools"><button title="Subir" aria-label="Subir" data-action="moveTask" data-id="'+t.id+'" data-dir="-1">'+ic('up')+'</button><button title="Bajar" aria-label="Bajar" data-action="moveTask" data-id="'+t.id+'" data-dir="1">'+ic('down')+'</button><button title="Editar / cambiar bloque" aria-label="Editar" data-action="editTask" data-id="'+t.id+'">'+ic('edit')+'</button></div></article>'}

-id="'+t.id+'">Eliminar</button>':'')+'<button type="button" class="btn ghost" data-action="closeModal">Cancelar</button><button type="submit" class="btn primary">'+(t?'Guardar cambios':'Añadir al día')+'</button></div></form>')}

function taskFromId(id){return dayTasks(ui.date).find(t=>t.id===id)}
function toggleTask(id){let t=taskFromId(id);if(!t)return;t.done=!t.done;t.completedAt=t.done?new Date().toISOString():null;save();render();toast(t.done?'Tarea completada'+(t.habitId?' · hábito actualizado':''):'Tarea marcada como pendiente')}
function toggleHabit(id,date){let h=db.habits.find(h=>h.id===id);if(!h||date>nowDate()||!habitActiveAt(h,date))return;let fromTask=dayTasks(date).some(t=>t.done&&t.habitId===id);if(fromTask){toast('Este hábito se completó por una tarea. Desmarca esa tarea para quitar el check.');return}if(!db.manual[date])db.manual[date]={};db.manual[date][id]=!db.manual[date][id];save();render()}
function moveTask(id,dir){let t=taskFromId(id);if(!t)return;let arr=blockTasks(t.block),i=arr.findIndex(a=>a.id===id),j=i+dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];arr.forEach((x,k)=>x.order=k);save();render()}
function changeBlock(id,block){let t=taskFromId(id);if(!t||!BLOCKS.some(b=>b.id===block)||t.block===block)return;t.block=block;t.order=blockTasks(block).length;save();render();toast('Tarea movida al bloque '+BLOCKS.find(x=>x.id===block).start)}
function removeTask(id){let ts=ensureDay(ui.date).tasks,i=ts.findIndex(t=>t.id===id);if(i===-1)return;if(!confirm('¿Eliminar esta tarea del día? Los tiempos registrados seguirán en el historial.'))return;ts.splice(i,1);closeModal();save();render();toast('Tarea eliminada del día')}
function quickLog(id){let t=taskFromId(id);if(!t)return;let inp=document.querySelector('[data-min="'+id+'"]'),minutes=num(inp?.value);if(minutes<=0||minutes>1440){toast('Escribe una duración válida (minutos).');return}db.sessions.push({id:aid(),date:ui.date,taskId:t.id,area:t.area,objective:t.objective||'',title:t.title,seconds:Math.round(minutes*60),note:'',kind:'manual',createdAt:new Date().toISOString()});save();render();toast(dur(minutes*60)+' registrados en '+t.area)}
function timerElapsed(){let t=db.timer;if(!t)return 0;return num(t.elapsed)+(t.running?Math.max(0,Math.floor((Date.now()-t.startedAt)/1000)):0)}
function startTimer(taskId=null){if(ui.date!==nowDate()){toast('El cronómetro funciona para hoy. Cambia al día actual.');return}if(db.timer){toast('Ya hay un cronómetro activo. Detén ese registro primero.');return}let task=taskId?taskFromId(taskId):null;db.timer={taskId:task?.id||null,area:task?.area||'Estructura',objective:task?.objective||'',title:task?.title||'Sesión libre',date:nowDate(),running:true,elapsed:0,startedAt:Date.now()};save();updateTimerDock();toast('Cronómetro iniciado')}
function timerPause(){if(!db.timer)return;db.timer.elapsed=timerElapsed();db.timer.running=false;save();updateTimerDock()}
function timerResume(){if(!db.timer)return;db.timer.running=true;db.timer.startedAt=Date.now();save();updateTimerDock()}
function timerEnd(){let t=db.timer;if(!t)return;let seconds=Math.max(1,timerElapsed());if(seconds<15&&!confirm('Solo han pasado '+seconds+' segundos. ¿Guardar esta sesión?'))return;db.sessions.push({id:aid(),date:t.date,taskId:t.taskId,area:t.area,objective:t.objective,title:t.title,seconds,note:'',kind:'timer',createdAt:new Date().toISOString()});db.timer=null;save();render();toast('Tiempo registrado: '+clockFmt(seconds))}
function updateTimerDock(){let t=db.timer,el=document.getElementById('timer-dock');if(!t){el.classList.remove('visible');return}el.classList.add('visible');el.innerHTML='<div><div class="clock" id="timer-time">'+clockFmt(timerElapsed())+'</div><div class="description">'+E(t.title)+'</div></div><div class="row" style="gap:6px"><button class="btn small" data-action="'+(t.running?'pauseTimer':'resumeTimer')+'">'+ic(t.running?'pause':'play')+' '+(t.running?'Pausar':'Seguir')+'</button><button class="btn red small" data-action="endTimer">'+ic('stop')+' Guardar</button></div>'}
function exportJSON(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});download(blob,'PULSO_respaldo_'+nowDate()+'.json')}
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportCSV(){let rows=[['Fecha','Área','Objetivo','Tarea','Minutos','Tipo','Nota']];db.sessions.forEach(s=>rows.push([s.date,s.area||'',s.objective||'',s.title||'',(num(s.seconds)/60).toFixed(2),s.kind||'',s.note||'']));let csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'PULSO_tiempos_'+nowDate()+'.csv')}
function restoreFile(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let parsed=JSON.parse(String(reader.result));if(!parsed||!Array.isArray(parsed.habits)||!Array.isArray(parsed.sessions)||!parsed.days||!Array.isArray(parsed.areas))throw Error('Formato no reconocido');if(!confirm('Esto reemplazará tus datos actuales por el respaldo. ¿Continuar?'))return;db=parsed;normalize();ui.date=nowDate();ui.month=ui.date.slice(0,7);save();render();toast('Respaldo restaurado correctamente')}catch(e){alert('No se pudo restaurar: '+e.message)}};reader.readAsText(file)}
function resetData(){if(!confirm('¿Borrar todos los registros, hábitos, planes y metas de esta herramienta? Esta acción no se puede deshacer.'))return;if(!confirm('Última confirmación: ¿ya descargaste tu respaldo?'))return;db=makeDefault();ui.date=nowDate();ui.month=ui.date.slice(0,7);save();render();toast('PULSO fue restablecido')}

function weeklyHours(){let s=sessionsIn('week',ui.date),tot=areaTotals(s),planned=db.areas.reduce((a,n)=>a+num(areaCfg(n).targetWeek),0),minimum=db.areas.reduce((a,n)=>a+num(areaCfg(n).minWeek),0),done=sumSec(s);return {planned,minimum,done,byArea:Object.fromEntries(tot),rate:pctVal(done,planned*3600)}}

function weekChart(label,number,unit,details){return '<div class="card"><div class="eyebrow">'+E(label)+'</div><strong style="display:block;font-size:27px;margin:9px 0">'+number+'<small style="font-size:13px"> '+unit+'</small></strong><div class="tagline">'+details+'</div></div>'}

});

document.addEventListener('click',e=>{let b=e.target.closest('#timer-dock [data-action]');if(!b)return;switch(b.dataset.action){case'pauseTimer':timerPause();break;case'resumeTimer':timerResume();break;case'endTimer':timerEnd();break}});
document.addEventListener('change',e=>{if(e.target.id==='import-file'){restoreFile(e.target.files?.[0]);e.target.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal-wrap').classList.contains('visible'))closeModal()});
// Drag and drop support for desktop. Arrow buttons work on touch devices.
let dragged=null;root.addEventListener('dragstart',e=>{let el=e.target.closest('.task');if(!el)return;dragged=el.dataset.task;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragged)});root.addEventListener('dragend',e=>{e.target.closest('.task')?.classList.remove('dragging');document.querySelectorAll('.dragover,.over').forEach(x=>x.classList.remove('dragover','over'));dragged=null});root.addEventListener('dragover',e=>{let list=e.target.closest('[data-drop]');if(!list||!dragged)return;e.preventDefault();list.closest('.block-card')?.classList.add('over');document.querySelectorAll('.task.dragover').forEach(x=>x.classList.remove('dragover'));let over=e.target.closest('.task');if(over&&over.dataset.task!==dragged)over.classList.add('dragover')});root.addEventListener('dragleave',e=>{let block=e.target.closest('.block-card');if(block&&!block.contains(e.relatedTarget))block.classList.remove('over')});root.addEventListener('drop',e=>{let list=e.target.closest('[data-drop]');if(!list||!dragged)return;e.preventDefault();let moved=taskFromId(dragged),block=list.dataset.drop,over=e.target.closest('.task');if(!moved)return;let destination=blockTasks(block).filter(x=>x.id!==dragged),idx=over?destination.findIndex(x=>x.id===over.dataset.task):-1;if(idx<0)idx=destination.length;destination.splice(idx,0,moved);moved.block=block;destination.forEach((t,i)=>t.order=i);save();render();dragged=null;toast('Orden del plan actualizado')});

root.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){
 case 'moveMorning':{let d=ensureDay(ui.date),start=d.startTime||'08:00',mins=Number(start.slice(0,2))*60+Number(start.slice(3)),target=BLOCKS.find(x=>{let a=Number(x.start.slice(0,2))*60+Number(x.start.slice(3)),end=x.end==='00:00'?1440:Number(x.end.slice(0,2))*60+Number(x.end.slice(3));return mins>=a&&mins<end&&x.id!=='b7'})||BLOCKS[0];let arr=d.tasks.filter(t=>t.block==='b1'&&!t.done);arr.forEach((t,i)=>{t.block=target.id;t.order=blockTasks(target.id).length+i;if(i===0)t.actualStart=start});save();render();toast(arr.length+' tareas de inicio movidas a '+target.title);break}
 case 'editArea':areaModal(b.dataset.id);break;
 case 'setTheme':db.settings.theme=b.dataset.theme==='light'?'light':'dark';save();render();break;
 case 'newReward':rewardModal();break;
 case 'editReward':rewardModal(b.dataset.id);break;
 case 'claimReward':{let r=db.rewards.find(x=>x.id===b.dataset.id);if(!r||num(r.cost)>rewardBalance())return;if(confirm('¿Canjear «'+r.name+'» por '+r.cost+' XP?')){db.claims.push({id:aid(),rewardId:r.id,name:r.name,cost:num(r.cost),date:nowDate()});save();render();toast('¡Premio canjeado!')}break}
}});
root.addEventListener('change',e=>{let t=e.target;if(t.matches('[data-action="toggleDoneView"]')){ui.showDone=t.checked;render();return}if(t.id==='day-start-time'){let d=ensureDay(ui.date);d.startTime=t.value||'08:00';save();render();return}if(t.id==='area-state'){ui.areaState=t.value;applyAreaFilters()}if(t.id==='area-dimension'){ui.areaDimension=t.value;applyAreaFilters()}});
root.addEventListener('input',e=>{if(e.target.id==='area-search'){ui.areaSearch=e.target.value;applyAreaFilters()}});
document.getElementById('modal-wrap').addEventListener('click',e=>{let b=e.target.closest('[data-action="deleteReward"]');if(b){let r=db.rewards.find(x=>x.id===b.dataset.id);if(r&&confirm('¿Eliminar premio «'+r.name+'»? Los canjes históricos no se devuelven.')){db.rewards=db.rewards.filter(x=>x.id!==r.id);save();closeModal();render()}}});

// Refresh timer and clock without rerendering editable views.
setInterval(()=>{let t=document.getElementById('timer-time');if(t&&db.timer)t.textContent=clockFmt(timerElapsed());let c=document.getElementById('live-clock');if(c)c.textContent=new Intl.DateTimeFormat('es-CO',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())},1000);
render();
})();
</script>
</body>
</html>
